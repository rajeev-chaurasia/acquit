name: "Acquit Test Selection"
description: "Provably skip unaffected pytest tests on every PR. Static analysis, fail-closed, with evidence for every skip."
branding:
  icon: "fast-forward"
  color: "blue"

inputs:
  base-ref:
    description: "Base ref to diff against. Defaults to the PR base."
    default: ""
  acquit-version:
    description: "Version of the acquit package to run."
    default: "0.2.0"  # x-release-please-version
  acquit-source:
    description: >-
      Where acquit itself is installed from. pypi (default) pins
      acquit==acquit-version; local installs from the working-directory
      checkout, which is how acquit dogfoods unreleased code on its own PRs.
    default: "pypi"
  working-directory:
    description: "Directory containing the project to analyze."
    default: "."
  mode:
    description: >-
      report: analyze, verify, comment, and set outputs, but never skip a test.
      canary: additionally export ACQUIT_SELECTION_FILE and ACQUIT_CANARY so
      the full suite still runs while the pytest plugin classifies outcomes
      against the verified selection; a failing would-be-skipped test raises a
      loud alarm at zero risk. enforce: export ACQUIT_SELECTION_FILE alone so
      the plugin honors the verified selection and skips. Anything
      unrecognized means report.
    default: "report"
  comment:
    description: "Post a sticky PR comment with the decision (true|false)."
    default: "true"

outputs:
  mode:
    description: "Selection mode after verification: run-all or selective."
    value: ${{ steps.verify.outputs.mode }}
  report-file:
    description: "Path to the report JSON."
    value: ${{ steps.select.outputs.report }}
  selection-file:
    description: "Path to the selection JSON consumed by the pytest plugin."
    value: ${{ steps.select.outputs.selection }}
  canary-report-file:
    description: "Path to the canary JSON evidence written after pytest finishes."
    value: ${{ steps.select.outputs.canary-report }}
  canary-summary-file:
    description: "Path to the reviewer-facing canary Markdown summary written after pytest finishes."
    value: ${{ steps.select.outputs.canary-summary }}
  skipped-count:
    description: "Number of test files provably unaffected."
    value: ${{ steps.ci-outputs.outputs.skipped }}
  selected-count:
    description: "Number of test files selected by impact."
    value: ${{ steps.ci-outputs.outputs.selected }}
  always-run-count:
    description: "Number of test files forced to run by a policy finding."
    value: ${{ steps.ci-outputs.outputs.always-run }}
  total-count:
    description: "Total number of test files considered."
    value: ${{ steps.ci-outputs.outputs.total }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.0.0

    - id: select
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACQUIT_FROM: ${{ inputs.acquit-source == 'local' && '.' || format('acquit=={0}', inputs.acquit-version) }}
        BASE_REF: ${{ inputs.base-ref != '' && inputs.base-ref || github.base_ref }}
        ACQUIT_MODE: ${{ inputs.mode }}
      run: |
        set -u
        RUN_ALL_DOC='{"schema":"acquit/selection-v2","mode":"run-all","graph_hash":null,"tree":{"head_sha":null,"fingerprint":null},"skip":[]}'
        MODE=run-all
        SAFE=1
        # A newline inside any of these paths could smuggle extra lines into
        # the runner files below; refuse to analyze and emit run-all instead.
        case "$PWD${RUNNER_TEMP:-}" in (*$'\n'*) SAFE=0 ;; esac
        if [ "$SAFE" = "1" ]; then
          OUT_DIR="${RUNNER_TEMP:-$PWD}"
          REPORT="$OUT_DIR/acquit-report.json"
          SELECTION="$OUT_DIR/acquit-selection.json"
          WITNESSES="$OUT_DIR/acquit-witnesses.json"
          CANARY_REPORT="${SELECTION%.*}.canary.json"
          CANARY_SUMMARY="${SELECTION%.*}.canary.md"
          if ! uvx --from "$ACQUIT_FROM" acquit select \
              --base "origin/${BASE_REF:-main}" --head HEAD \
              --report "$REPORT" --selection "$SELECTION" --witnesses "$WITNESSES"; then
            # Fail closed: a broken tool must never reduce the test run.
            printf '%s\n' "$RUN_ALL_DOC" > "$SELECTION"
            printf '{"schema":"acquit/report-v1","decision":{"mode":"run-all"}}\n' > "$REPORT"
          fi
          # The mode output must never contradict the document pytest obeys,
          # so it is read back from the document itself, not from a probe.
          DOC=""
          if [ -f "$SELECTION" ]; then DOC=$(<"$SELECTION"); fi
          case "$DOC" in (*'"mode": "selective"'*|*'"mode":"selective"'*) MODE=selective ;; esac
        else
          REPORT=""
          SELECTION=""
          WITNESSES=""
          CANARY_REPORT=""
          CANARY_SUMMARY=""
        fi
        printf 'mode<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$MODE" >> "$GITHUB_OUTPUT"
        printf 'report<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$REPORT" >> "$GITHUB_OUTPUT"
        printf 'selection<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$SELECTION" >> "$GITHUB_OUTPUT"
        printf 'witnesses<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$WITNESSES" >> "$GITHUB_OUTPUT"
        printf 'canary-report<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$CANARY_REPORT" >> "$GITHUB_OUTPUT"
        printf 'canary-summary<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$CANARY_SUMMARY" >> "$GITHUB_OUTPUT"
        # Only enforce and canary hook the pytest plugin; report mode observes
        # and never touches the test run, and an unrecognized mode means report.
        if [ "${ACQUIT_MODE:-report}" = "enforce" ] || [ "${ACQUIT_MODE:-report}" = "canary" ]; then
          printf 'ACQUIT_SELECTION_FILE<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$SELECTION" >> "$GITHUB_ENV"
        fi
        # Canary still runs everything; the plugin only classifies outcomes.
        if [ "${ACQUIT_MODE:-report}" = "canary" ]; then
          printf 'ACQUIT_CANARY<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "1" >> "$GITHUB_ENV"
        fi
        echo "### Acquit" >> "$GITHUB_STEP_SUMMARY"
        echo "Selection mode: \`$MODE\`" >> "$GITHUB_STEP_SUMMARY"

    - id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACQUIT_FROM: ${{ inputs.acquit-source == 'local' && '.' || format('acquit=={0}', inputs.acquit-version) }}
        MODE: ${{ steps.select.outputs.mode }}
        REPORT: ${{ steps.select.outputs.report }}
        SELECTION: ${{ steps.select.outputs.selection }}
        WITNESSES: ${{ steps.select.outputs.witnesses }}
      run: |
        set -u
        RUN_ALL_DOC='{"schema":"acquit/selection-v2","mode":"run-all","graph_hash":null,"tree":{"head_sha":null,"fingerprint":null},"skip":[]}'
        FINAL="${MODE:-run-all}"
        if [ "$FINAL" = "selective" ]; then
          # Replay the evidence before any skip is honored; an unverifiable
          # selection is rewritten to run-all, not merely reported as such.
          if ! uvx --from "$ACQUIT_FROM" acquit replay "$REPORT" \
              --witnesses "$WITNESSES" --selection "$SELECTION"; then
            FINAL=run-all
            if ! printf '%s\n' "$RUN_ALL_DOC" > "$SELECTION"; then
              # The document could not be neutralized; unhook the plugin.
              printf 'ACQUIT_SELECTION_FILE<<EOF_ACQUIT_c9d41e\n\nEOF_ACQUIT_c9d41e\n' >> "$GITHUB_ENV"
            fi
          fi
        fi
        printf 'mode<<EOF_ACQUIT_c9d41e\n%s\nEOF_ACQUIT_c9d41e\n' "$FINAL" >> "$GITHUB_OUTPUT"
        echo "Verified mode: \`$FINAL\`" >> "$GITHUB_STEP_SUMMARY"

    - id: ci-outputs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACQUIT_FROM: ${{ inputs.acquit-source == 'local' && '.' || format('acquit=={0}', inputs.acquit-version) }}
        REPORT: ${{ steps.select.outputs.report }}
        SELECTION: ${{ steps.select.outputs.selection }}
      run: |
        set -u
        # Informational plumbing: broken outputs must never break the build,
        # and steps reading empty outputs fail closed on their own.
        if [ -n "${REPORT:-}" ] && [ -f "$REPORT" ] && [ -n "${SELECTION:-}" ] && [ -f "$SELECTION" ]; then
          uvx --from "$ACQUIT_FROM" acquit ci-outputs "$REPORT" "$SELECTION" || true
        fi

    - id: comment
      if: ${{ inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACQUIT_FROM: ${{ inputs.acquit-source == 'local' && '.' || format('acquit=={0}', inputs.acquit-version) }}
        REPORT: ${{ steps.select.outputs.report }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -u
        # Best effort by design: a lost comment must never fail CI.
        if [ -n "${REPORT:-}" ] && [ -f "$REPORT" ]; then
          uvx --from "$ACQUIT_FROM" acquit comment "$REPORT" || true
        fi
