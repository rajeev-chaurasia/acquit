# Maintains a running release PR from conventional commits. Merging that PR
# bumps the version, updates the changelog, tags, and creates the GitHub
# release. Releases created with the workflow token do not fire on-release
# workflows (GitHub's cascade guard), so this workflow dispatches the publish
# explicitly when a release was created.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: python

      - if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f tag="${{ steps.release.outputs.tag_name }}"
