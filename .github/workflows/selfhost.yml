# Acquit running on its own pull requests: the public demo.
#
# Canary is the default live mode: the action analyzes the diff, replays the
# evidence, posts the sticky PR comment, and pytest still runs the full suite
# while the plugin classifies every outcome against the verified selection.
# A failing test acquit called unaffected surfaces as a loud alarm, at zero
# risk, because nothing was actually skipped. Set the repository variable
# ACQUIT_ENFORCE to 'true' to let the plugin skip tests for real.

name: acquit-selfhost

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  acquit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: acquit
        uses: ./
        with:
          # Enforce must not inherit canary's ACQUIT_CANARY export, so the
          # mode follows the switch instead of a literal.
          mode: ${{ vars.ACQUIT_ENFORCE == 'true' && 'enforce' || 'canary' }}
          acquit-source: local

      - uses: astral-sh/setup-uv@v10.0.0

      - name: Run the full suite (canary)
        if: ${{ vars.ACQUIT_ENFORCE != 'true' }}
        env:
          # The action already exported both through GITHUB_ENV; kept explicit
          # here so the demo reads without opening action.yml.
          ACQUIT_SELECTION_FILE: ${{ steps.acquit.outputs.selection-file }}
          ACQUIT_CANARY: "1"
        run: uv run pytest

      - name: Run the selected suite (enforce)
        if: ${{ vars.ACQUIT_ENFORCE == 'true' }}
        env:
          ACQUIT_SELECTION_FILE: ${{ steps.acquit.outputs.selection-file }}
        run: uv run pytest

      - name: Upload canary evidence
        if: ${{ vars.ACQUIT_ENFORCE != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: acquit-canary-evidence
          path: |
            ${{ steps.acquit.outputs.canary-report-file }}
            ${{ steps.acquit.outputs.canary-summary-file }}
          if-no-files-found: warn
