# Publishes to PyPI via trusted publishing (OIDC): no tokens exist anywhere.
# The workflow filename and the release environment are part of the PyPI
# trusted-publisher registration; renaming either breaks publishing.
#
# Runs on release published, and on dispatch from release-please (releases
# created with the workflow token cannot fire on-release workflows).

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build and publish
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
