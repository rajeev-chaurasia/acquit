# Acquit analyzing acquit: the dogfooding configuration.

# Re-export narrowing (ADR 0008) runs live here: the selfhost canary
# classifies every narrowed decision against the full suite.
narrowing = true

[[waive]]
rule = "R006"
glob = "tests/fixtures/conftest.py"
justification = "collect_ignore here only excludes fixture-repo files from collection; it never adds or redirects tests, so static discovery stays over-inclusive, which is the safe direction."
